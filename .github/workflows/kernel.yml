name: kernel

# 不再自己维护内核构建：底座是 lakitu12/linux-um-arm64-gki
# （Android 17 GKI 6.18 + arm64 UML 移植，含 SMP / umfb / virtio-gpu）。
# 这里只做三件事：克隆它、叠加我们的配置片段、出手机端可用的产物。
#
# root 方案：SukiSU Ultra（KSU 超集，含 KPM/SUSFS）。内核只开 LKM 所需的
# CONFIG_MODULES/KALLSYMS/KPROBES，kernelsu.ko 另行外编（CONFIG_KSU=m CONFIG_KPM=y）。

on:
  workflow_dispatch:
    inputs:
      pages4k:
        description: "4 KB guest 页（与 4 KB 宿主 1:1，redroid-13 用户态要的就是这个）"
        type: boolean
        default: true
      extra_config:
        description: "追加的 kconfig 片段，空格分隔，相对 tools/um-arm64/"
        type: string
        default: "config/sukisu-lkm.config"

env:
  NDK_VER: r28c
  UPSTREAM: https://github.com/lakitu12/linux-um-arm64-gki
  SUKISU: https://github.com/SukiSU-Ultra/SukiSU-Ultra

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: 腾磁盘
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm lld libelf-dev zlib1g-dev flex bison make file cpio \
            e2fsprogs unzip curl

      - name: 缓存 NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/android-ndk
          key: ndk-${{ env.NDK_VER }}

      - name: 下载 NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip" -o /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /tmp/ndk-x
          mkdir -p /home/runner/android-ndk
          mv /tmp/ndk-x/android-ndk-${NDK_VER}/* /home/runner/android-ndk/
          rm -rf /tmp/ndk.zip /tmp/ndk-x
          test -x /home/runner/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang

      - name: 克隆内核树
        run: |
          git clone --depth 1 "$UPSTREAM" ksrc
          git -C ksrc rev-parse HEAD | tee ksrc-sha.txt

      - name: 叠加我们的片段
        run: cp kernel/config/sukisu-lkm.config ksrc/tools/um-arm64/config/

      - name: 生成 arm64 生成头 + 修 GKI 的 KVM 头依赖
        run: |
          # ARCH=um 不会跑 arch/arm64 的 prepare，asm/sysreg-defs.h 永远不会生成；
          # 而 CONFIG_MODULES 会编 arch/arm64/kernel/module-plts.c，GKI 里它经
          # kvm_pkvm_module.h → kvm_pgtable.h → kvm_host.h → arch_gicv3.h → sysreg.h
          # 引到 asm/sysreg-defs.h。按 arch/arm64/tools/Makefile 的规则手工补。
          set -euo pipefail
          T=ksrc/arch/arm64/tools
          awk -f $T/gen-sysreg.awk   $T/sysreg   > /tmp/sysreg-defs.h
          awk -f $T/gen-cpucaps.awk  $T/cpucaps > /tmp/cpucap-defs.h
          for d in arch/arm64/include/asm arch/arm64/include/generated/asm; do
            mkdir -p ksrc/$d
            cp /tmp/sysreg-defs.h /tmp/cpucap-defs.h ksrc/$d/
          done
          wc -l /tmp/sysreg-defs.h /tmp/cpucap-defs.h

          # 光有 sysreg-defs.h 还不够：arch_gicv3.h 要的是 arm64 的 asm/barrier.h
          # 的 isb/dsb/nops 与 asm/capability.h 的 cpus_have_cap，ARCH=um 下这些
          # asm 头走 UM 的通用版本，压根没有这些符号。
          # module-plts.c 是唯一理由：它无条件 include <asm/kvm_pkvm_module.h>，
          # 而全文件只用到 pkvm_el2_mod_frob_sections()，那个调用被
          # #if IS_ENABLED(CONFIG_KVM) 包着。UML 没有 KVM，删掉这行 include 即可，
          # 整条 kvm_host.h 依赖随即断开。
          sed -i '/kvm_pkvm_module\.h/d' ksrc/arch/arm64/kernel/module-plts.c
          echo "--- module-plts.c 里残留的 kvm 引用（应为 0）---"
          grep -c 'pkvm' ksrc/arch/arm64/kernel/module-plts.c || true

          # 第二个被 CONFIG_MODULES 才暴露的坑：arch/arm64/um/asm/text-patching.h 声明了
          # void *text_poke_copy(...)，却没按内核惯例定义 text_poke_copy 宏；一旦 EXECMEM
          # （由 MODULES 拉入）编到 mm/execmem.c，include/linux/text-patching.h 的
          # static inline 兜底就和原型撞车。补宏即可，实现仍在 UML 的 patching 里。
          grep -q 'define text_poke_copy text_poke_copy' ksrc/arch/arm64/um/asm/text-patching.h || \
            printf '\n#ifndef text_poke_copy\n#define text_poke_copy text_poke_copy\n#endif\n' \
              >> ksrc/arch/arm64/um/asm/text-patching.h
          tail -4 ksrc/arch/arm64/um/asm/text-patching.h

      - name: 构建 bionic 内核
        working-directory: ksrc/tools/um-arm64
        env:
          NDK: /home/runner/android-ndk
          TREE: ${{ github.workspace }}/ksrc
          ART: ${{ github.workspace }}/artifacts
          O: ${{ runner.temp }}/um-gki618-build
        run: |
          set -euo pipefail
          EXTRA="config/docker.config config/docker-completions.config config/snap-flatpak.config"
          EXTRA="$EXTRA config/android-guest.config config/umfb.config config/vt.config"
          EXTRA="$EXTRA config/virtio-gpu.config config/virtio-snd.config config/usb-wifi.config"
          if [ "${{ inputs.pages4k }}" = "true" ]; then EXTRA="$EXTRA config/page4k.config"; fi
          if [ -n "${{ inputs.extra_config }}" ]; then EXTRA="$EXTRA ${{ inputs.extra_config }}"; fi
          echo "EXTRA_CONFIG=$EXTRA"
          # UML 的 arch/um/include/asm 是构建期才生成的符号链接（指向 x86），
          # 所以不能在那里放补丁文件：直接改头文件本体，让两边的 xor.h 都走通用实现，
          # 否则 arm64 SUBARCH 下会编到 x86 的内联汇编（invalid input constraint 're'）。
          # 注意本 step 的 cwd 是 ksrc/tools/um-arm64，源码树一律用 $TREE 绝对路径。
          for f in "$TREE/arch/x86/include/asm/xor.h" "$TREE/arch/arm64/include/asm/xor.h"; do
            printf '#include <asm-generic/xor.h>\n' > "$f"
          done
          # kprobes：父架构 probes 实现 + UML 陷入入口/文本改写（kernel/patches/um-kprobes/）
          bash "$GITHUB_WORKSPACE/kernel/patches/um-kprobes/apply.sh" "$TREE"
          EXTRA_CONFIG="$EXTRA" bash harness/build-bionic.sh

      - name: 核对关键 CONFIG
        run: |
          C="${{ runner.temp }}/um-gki618-build/.config"
          test -f "$C" || { echo "找不到 $C"; find "${{ runner.temp }}" -name .config -maxdepth 3; exit 1; }
          echo "===== 关键项实际取值 ====="
          for k in SMP NR_CPUS MODULES MODULE_UNLOAD KALLSYMS KALLSYMS_ALL KPROBES KRETPROBES EXECMEM \
                   EXT4_FS OVERLAY_FS FANOTIFY SECURITY SECURITYFS AUDIT SECURITY_SELINUX \
                   ANDROID_BINDERFS ANDROID_BINDER_IPC ANDROID_BINDER_DEVICES MODVERSIONS MODULE_SIG_FORCE DEBUG_INFO_BTF \
                   TRACING EVENT_TRACING FTRACE_SYSCALLS KPROBE_EVENTS \
                   EROFS_FS SQUASHFS FUSE_FS ZRAM PSI MEMCG BLK_CGROUP CGROUP_DEVICE CGROUP_PIDS CPUSETS \
                   VETH BRIDGE NF_TABLES NET_CLS_ACT NET_SCH_HTB BLK_DEV_THROTTLING CFS_BANDWIDTH \
                   MEMFD_CREATE TMPFS_XATTR KEYS USER_NS SECCOMP_FILTER; do
            printf '%-24s ' "$k"
            grep -E "^CONFIG_${k}=" "$C" || echo "(未设置)"
          done
          cp "$C" artifacts/kernel-config.txt

      - name: Alpine 根盘
        run: KOUT=$PWD/artifacts bash rootfs/mkrootfs-alpine.sh

      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: artifacts/*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: um-gki618-${{ inputs.pages4k == true && '4k' || '16k' }}
          path: |
            artifacts/linux-bionic*
            artifacts/stub_exe*
            artifacts/kernelsu.ko
            artifacts/alpine.ext4
            artifacts/run.sh
            artifacts/kernel-config.txt
            ksrc-sha.txt

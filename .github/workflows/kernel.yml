name: kernel

# 不再自己维护内核构建：底座是 lakitu12/linux-um-arm64-gki
# （Android 17 GKI 6.18 + arm64 UML 移植，含 SMP / umfb / virtio-gpu）。
# 这里只做三件事：克隆它、叠加我们的配置片段、出手机端可用的产物。
#
# root 方案：SukiSU Ultra（KSU 超集，含 KPM/SUSFS）。内核只开 LKM 所需的
# CONFIG_MODULES/KALLSYMS/KPROBES，kernelsu.ko 另行外编（CONFIG_KSU=m CONFIG_KPM=y）。

on:
  workflow_dispatch:
    inputs:
      pages4k:
        description: "4 KB guest 页（与 4 KB 宿主 1:1，redroid-13 用户态要的就是这个）"
        type: boolean
        default: true
      extra_config:
        description: "追加的 kconfig 片段，空格分隔，相对 tools/um-arm64/"
        type: string
        default: "config/sukisu-lkm.config"
      modules_only:
        description: "快路：只 prepared 内核头 + 外编 .ko（约 8 分钟，不出 linux-bionic）"
        type: boolean
        default: false

env:
  NDK_VER: r28c
  UPSTREAM: https://github.com/lakitu12/linux-um-arm64-gki
  SUKISU: https://github.com/SukiSU-Ultra/SukiSU-Ultra

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: 腾磁盘
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm lld libelf-dev zlib1g-dev flex bison make file cpio \
            e2fsprogs unzip curl

      - name: 缓存 NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/android-ndk
          key: ndk-${{ env.NDK_VER }}

      - name: 下载 NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip" -o /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /tmp/ndk-x
          mkdir -p /home/runner/android-ndk
          mv /tmp/ndk-x/android-ndk-${NDK_VER}/* /home/runner/android-ndk/
          rm -rf /tmp/ndk.zip /tmp/ndk-x
          test -x /home/runner/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang

      - name: 克隆内核树
        run: |
          git clone --depth 1 "$UPSTREAM" ksrc
          git -C ksrc rev-parse HEAD | tee ksrc-sha.txt

      - name: 克隆 SukiSU Ultra（只用到 kernel/ 下的模块源码）
        run: |
          # kernelsu.ko 必须对着本内核自己编，管理器那边才能选文件安装/升级。
          git clone --depth 1 "$SUKISU" sukisu
          git -C sukisu rev-parse HEAD | tee sukisu-sha.txt

      - name: 给 SukiSU 打 UML 兼容补丁
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/sukisu"
          python3 "$GITHUB_WORKSPACE/kernel/patches/sukisu-um/ptregs-um.py" kernel
          # ARCH=um 下 include/arch.h 会撞上内核自己的 arch/um/include/shared/arch.h；
          # syscall_fn_t 与 vdso 头也要补/绕。见脚本头部说明。
          python3 "$GITHUB_WORKSPACE/kernel/patches/sukisu-um/um-compat.py" kernel
          # 补丁跑完自检：字段式寄存器访问必须一个不剩（UML 的 regs 不是数组）。
          if grep -rn -- "->__PT_" --include='*.c' kernel | grep -v '^kernel/include/ksu-arch.h'; then
            echo "还有字段式寄存器访问没改干净"; exit 1
          fi

      - name: 叠加我们的片段
        run: cp kernel/config/sukisu-lkm.config ksrc/tools/um-arm64/config/

      - name: 生成 arm64 生成头 + 修 GKI 的 KVM 头依赖
        run: |
          # ARCH=um 不会跑 arch/arm64 的 prepare，asm/sysreg-defs.h 永远不会生成；
          # 而 CONFIG_MODULES 会编 arch/arm64/kernel/module-plts.c，GKI 里它经
          # kvm_pkvm_module.h → kvm_pgtable.h → kvm_host.h → arch_gicv3.h → sysreg.h
          # 引到 asm/sysreg-defs.h。按 arch/arm64/tools/Makefile 的规则手工补。
          set -euo pipefail
          T=ksrc/arch/arm64/tools
          awk -f $T/gen-sysreg.awk   $T/sysreg   > /tmp/sysreg-defs.h
          awk -f $T/gen-cpucaps.awk  $T/cpucaps > /tmp/cpucap-defs.h
          for d in arch/arm64/include/asm arch/arm64/include/generated/asm; do
            mkdir -p ksrc/$d
            cp /tmp/sysreg-defs.h /tmp/cpucap-defs.h ksrc/$d/
          done
          wc -l /tmp/sysreg-defs.h /tmp/cpucap-defs.h

          # 光有 sysreg-defs.h 还不够：arch_gicv3.h 要的是 arm64 的 asm/barrier.h
          # 的 isb/dsb/nops 与 asm/capability.h 的 cpus_have_cap，ARCH=um 下这些
          # asm 头走 UM 的通用版本，压根没有这些符号。
          # module-plts.c 是唯一理由：它无条件 include <asm/kvm_pkvm_module.h>，
          # 而全文件只用到 pkvm_el2_mod_frob_sections()，那个调用被
          # #if IS_ENABLED(CONFIG_KVM) 包着。UML 没有 KVM，删掉这行 include 即可，
          # 整条 kvm_host.h 依赖随即断开。
          sed -i '/kvm_pkvm_module\.h/d' ksrc/arch/arm64/kernel/module-plts.c
          echo "--- module-plts.c 里残留的 kvm 引用（应为 0）---"
          grep -c 'pkvm' ksrc/arch/arm64/kernel/module-plts.c || true

          # 第二个被 CONFIG_MODULES 才暴露的坑：arch/arm64/um/asm/text-patching.h 声明了
          # void *text_poke_copy(...)，却没按内核惯例定义 text_poke_copy 宏；一旦 EXECMEM
          # （由 MODULES 拉入）编到 mm/execmem.c，include/linux/text-patching.h 的
          # static inline 兜底就和原型撞车。补宏即可，实现仍在 UML 的 patching 里。
          grep -q 'define text_poke_copy text_poke_copy' ksrc/arch/arm64/um/asm/text-patching.h || \
            printf '\n#ifndef text_poke_copy\n#define text_poke_copy text_poke_copy\n#endif\n' \
              >> ksrc/arch/arm64/um/asm/text-patching.h
          tail -4 ksrc/arch/arm64/um/asm/text-patching.h

      - name: 构建 bionic 内核
        if: ${{ !inputs.modules_only }}
        working-directory: ksrc/tools/um-arm64
        env:
          NDK: /home/runner/android-ndk
          TREE: ${{ github.workspace }}/ksrc
          ART: ${{ github.workspace }}/artifacts
          O: ${{ runner.temp }}/um-gki618-build
        run: |
          set -euo pipefail
          EXTRA="config/docker.config config/docker-completions.config config/snap-flatpak.config"
          EXTRA="$EXTRA config/android-guest.config config/umfb.config config/vt.config"
          EXTRA="$EXTRA config/virtio-gpu.config config/virtio-snd.config config/usb-wifi.config"
          if [ "${{ inputs.pages4k }}" = "true" ]; then EXTRA="$EXTRA config/page4k.config"; fi
          if [ -n "${{ inputs.extra_config }}" ]; then EXTRA="$EXTRA ${{ inputs.extra_config }}"; fi
          echo "EXTRA_CONFIG=$EXTRA"
          # UML 的 arch/um/include/asm 是构建期才生成的符号链接（指向 x86），
          # 所以不能在那里放补丁文件：直接改头文件本体，让两边的 xor.h 都走通用实现，
          # 否则 arm64 SUBARCH 下会编到 x86 的内联汇编（invalid input constraint 're'）。
          # 注意本 step 的 cwd 是 ksrc/tools/um-arm64，源码树一律用 $TREE 绝对路径。
          for f in "$TREE/arch/x86/include/asm/xor.h" "$TREE/arch/arm64/include/asm/xor.h"; do
            printf '#include <asm-generic/xor.h>\n' > "$f"
          done
          # kprobes：父架构 probes 实现 + UML 陷入入口/文本改写（kernel/patches/um-kprobes/）
          bash "$GITHUB_WORKSPACE/kernel/patches/um-kprobes/apply.sh" "$TREE"
          EXTRA_CONFIG="$EXTRA" bash harness/build-bionic.sh

      - name: 快路：只准备内核头（modules_only）
        if: ${{ inputs.modules_only }}
        env:
          NDK: /home/runner/android-ndk
          TREE: ${{ github.workspace }}/ksrc
          O: ${{ runner.temp }}/um-gki618-build
        run: |
          set -euo pipefail
          TOOL=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          test -x "$TOOL/clang"
          # 这一步没有步骤级 env，ART 得自己给（否则 set -u 下重定向直接炸）
          ART="${{ github.workspace }}/artifacts"
          mkdir -p "$ART"
          # 和 harness/build-bionic.sh 完全一样的 bionic 封装：编模块与编内核
          # 必须用同一个 --target，否则结构体布局与 vermagic 都对不上。
          API=$(grep -m1 -o 'API:*-[0-9]\+' ksrc/tools/um-arm64/harness/build-bionic.sh | grep -o '[0-9]\+$' || true)
          : "${API:=35}"
          echo "bionic API=$API"
          SHIM=$O/.bionic-shim
          mkdir -p "$SHIM"
          printf '#!/bin/sh\nexec %s/clang "$@" --target=aarch64-linux-android%s\n' "$TOOL" "$API" > "$SHIM/clang"
          cp "$SHIM/clang" "$SHIM/clang++"
          chmod +x "$SHIM/clang" "$SHIM/clang++"
          for t in ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            ln -sf "$TOOL/$t" "$SHIM/$t"
          done
          export PATH="$SHIM:$TOOL:/usr/bin:$PATH"
          export KBUILD_BUILD_TIMESTAMP="Thu Jan  1 00:00:00 UTC 1970"
          export KBUILD_BUILD_USER=um KBUILD_BUILD_HOST=arm64
          # build-bionic.sh 在编内核前对源码做的两处改写（xor 头、kprobes 移植）
          # 在「构建 bionic 内核」那一步里；快路跳过了那步，这里补上。
          for f in "$TREE/arch/x86/include/asm/xor.h" "$TREE/arch/arm64/include/asm/xor.h"; do
            printf '#include <asm-generic/xor.h>\n' > "$f"
          done
          bash "$GITHUB_WORKSPACE/kernel/patches/um-kprobes/apply.sh" "$TREE"
          MK=(make -C "$TREE" O="$O" ARCH=um SUBARCH=arm64 LLVM=1
              HOSTCC=/usr/bin/clang HOSTCXX=/usr/bin/clang++ -j"$(nproc)")
          "${MK[@]}" defconfig
          "$TREE"/scripts/config --file "$O/.config" -e STATIC_LINK -e UML_NET_VECTOR
          # 片段必须与上面的「构建 bionic 内核」保持一致：模块编译依赖
          # MODULES/KPROBES/KALLSYMS_ALL/SELINUX，缺一个编的就是另一套环境。
          EXTRA="config/smp.config"
          EXTRA="$EXTRA config/docker.config config/docker-completions.config config/snap-flatpak.config"
          EXTRA="$EXTRA config/android-guest.config config/umfb.config config/vt.config"
          EXTRA="$EXTRA config/virtio-gpu.config config/virtio-snd.config config/usb-wifi.config"
          if [ "${{ inputs.pages4k }}" = "true" ]; then EXTRA="$EXTRA config/page4k.config"; fi
          EXTRA="$EXTRA ${{ inputs.extra_config }}"
          for frag in $EXTRA; do
            "$TREE/scripts/kconfig/merge_config.sh" -m -O "$O" "$O/.config" \
              "$TREE/tools/um-arm64/$frag" >/dev/null
          done
          "${MK[@]}" olddefconfig
          # modules_prepare 只生成头文件与 scripts，比编整个内核快一个数量级；
          # 外编 .ko 需要的正是这些。
          "${MK[@]}" modules_prepare
          # 模块里 selinux/* 要 include <flask.h>，那是编译 security/selinux 时才
          # 生成的头（modules_prepare 不管）。全量构建顺带就有了，快路得自己补，
          # 否则会看到一堆假的 "fatal error: 'flask.h' file not found"。
          "${MK[@]}" security/selinux/ > "$ART/selinux-headers.log" 2>&1 || {
            echo "===== 生成 security/selinux 头失败 ====="
            grep -aE "error:|Error [0-9]" "$ART/selinux-headers.log" | head -20
            exit 1
          }
          grep -E '^CONFIG_(MODULES|MODPROBE_PATH|KPROBES|KRETPROBES|KALLSYMS_ALL|SECURITY_SELINUX)=' \
            "$O/.config" || true
          test -x "$O/.bionic-shim/clang"

      - name: 外编 kernelsu.ko 与 kprobe 自测模块
        env:
          NDK: /home/runner/android-ndk
          TREE: ${{ github.workspace }}/ksrc
          ART: ${{ github.workspace }}/artifacts
          O: ${{ runner.temp }}/um-gki618-build
        run: |
          set -euo pipefail
          # 快路不会经过 build-bionic.sh，artifacts/ 可能还不存在；日志重定向
          # 到不存在的目录会让整个 make 直接失败，且一个错误都看不到。
          mkdir -p "$ART"
          TOOL=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          # 复用上一步留下的 bionic shim：模块必须和内核用同一个 --target 编，
          # 否则 vermagic 里的编译器/ABI 细节对不上。
          test -x "$O/.bionic-shim/clang" || { echo "找不到 $O/.bionic-shim/clang"; exit 1; }
          export PATH="$O/.bionic-shim:$TOOL:/usr/bin:$PATH"
          # CONFIG_KSU/CONFIG_KPM 不进内核 .config（内核本身不含 KSU），
          # 只在编 .ko 时用 make 变量传，这也是 LKM 形态升级的基础。
          # -k 让 make 一次跑完所有源文件：UML 上第一次编 kernelsu.ko 一定会
          # 撞上多处 arm64 假设，一个一个试要跑很多趟 CI。失败时把 error 去重打出来。
          # 快路只有 modules_prepare，没有 vmlinux / Module.symvers，modpost 会把
          # 每个内核符号都判为 undefined（连 _printk 都是）。快路只用来收敛编译
          # 错误，所以把 undefined 降级成警告；全量构建照旧严格，产物才可信。
          MPOST=""
          if [ "${{ inputs.modules_only }}" = "true" ]; then MPOST="KBUILD_MODPOST_WARN=1"; fi
          if ! make -C "$TREE" O="$O" ARCH=um SUBARCH=arm64 LLVM=1 \
               HOSTCC=/usr/bin/clang HOSTCXX=/usr/bin/clang++ \
               M="$GITHUB_WORKSPACE/sukisu/kernel" CONFIG_KSU=m CONFIG_KPM=y  $MPOST \
               -j"$(nproc)" -k modules > "$ART/kernelsu.log" 2>&1; then
            echo "===== kernelsu.ko 编译失败，去重后的错误 ====="
            grep -aE "error:|fatal error|Error [0-9]" "$ART/kernelsu.log" \
              | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -40
            bad=$(grep -aoE '^[A-Za-z0-9_/]+\.c:[0-9]+:' "$ART/kernelsu.log" | head -1 | cut -d: -f1)
            if [ -n "$bad" ]; then
              echo "===== $bad 的包含路径（-I 顺序就是 arch.h 撞车的现场） ====="
              make -C "$TREE" O="$O" ARCH=um SUBARCH=arm64 LLVM=1 \
                   HOSTCC=/usr/bin/clang HOSTCXX=/usr/bin/clang++ \
                   M="$GITHUB_WORKSPACE/sukisu/kernel" CONFIG_KSU=m CONFIG_KPM=y \
                   V=1 -k "${bad%.c}.o" 2>&1 | grep -a 'clang' | head -1 \
                | tr ' ' '\n' | grep -E '^-I|^-D|^-include' | head -40
            fi
            exit 1
          fi
          tail -3 "$ART/kernelsu.log"
          if ! make -C "$TREE" O="$O" ARCH=um SUBARCH=arm64 LLVM=1 \
               HOSTCC=/usr/bin/clang HOSTCXX=/usr/bin/clang++ \
               M="$GITHUB_WORKSPACE/kernel/testmod"  $MPOST \
               -j"$(nproc)" -k modules > "$ART/testmod.log" 2>&1; then
            echo "===== kprobe-test.ko 编译失败 ====="
            grep -aE "error:|fatal error|Error [0-9]" "$ART/testmod.log" \
              | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -20
            exit 1
          fi
          tail -3 "$ART/testmod.log"
          cp "$GITHUB_WORKSPACE/sukisu/kernel/kernelsu.ko" "$ART/kernelsu.ko"
          cp "$GITHUB_WORKSPACE/kernel/testmod/kprobe-test.ko" "$ART/kprobe-test.ko"
          llvm-strip -d "$ART/kernelsu.ko" "$ART/kprobe-test.ko" || true
          for f in "$ART/kernelsu.ko" "$ART/kprobe-test.ko"; do
            echo "--- $f"
            ls -lh "$f"
            "$TOOL/llvm-readelf" -h "$f" | grep -E "Machine|Type"
            "$TOOL/llvm-nm" --undefined-only "$f" | grep -E "kprobe|kretprobe|register_kprobe" || true
          done

      - name: 核对关键 CONFIG
        run: |
          C="${{ runner.temp }}/um-gki618-build/.config"
          test -f "$C" || { echo "找不到 $C"; find "${{ runner.temp }}" -name .config -maxdepth 3; exit 1; }
          echo "===== 关键项实际取值 ====="
          for k in SMP NR_CPUS MODULES MODULE_UNLOAD KALLSYMS KALLSYMS_ALL KPROBES KRETPROBES EXECMEM \
                   EXT4_FS OVERLAY_FS FANOTIFY SECURITY SECURITYFS AUDIT SECURITY_SELINUX \
                   ANDROID_BINDERFS ANDROID_BINDER_IPC ANDROID_BINDER_DEVICES MODVERSIONS MODULE_SIG_FORCE DEBUG_INFO DEBUG_INFO_BTF \
                   TRACING EVENT_TRACING FTRACE_SYSCALLS KPROBE_EVENTS \
                   EROFS_FS SQUASHFS FUSE_FS ZRAM PSI MEMCG BLK_CGROUP CGROUP_DEVICE CGROUP_PIDS CPUSETS \
                   VETH BRIDGE NF_TABLES NET_CLS_ACT NET_SCH_HTB BLK_DEV_THROTTLING CFS_BANDWIDTH \
                   MEMFD_CREATE TMPFS_XATTR KEYS USER_NS SECCOMP_FILTER; do
            printf '%-24s ' "$k"
            grep -E "^CONFIG_${k}=" "$C" || echo "(未设置)"
          done
          cp "$C" artifacts/kernel-config.txt

      - name: Alpine 根盘
        run: KOUT=$PWD/artifacts bash rootfs/mkrootfs-alpine.sh

      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: artifacts/*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.modules_only }}
        with:
          name: um-gki618-${{ inputs.pages4k == true && '4k' || '16k' }}
          path: |
            artifacts/linux-bionic*
            artifacts/stub_exe*
            artifacts/kernelsu.ko
            artifacts/kprobe-test.ko
            artifacts/alpine.ext4
            artifacts/run.sh
            artifacts/kernel-config.txt
            ksrc-sha.txt
            sukisu-sha.txt
